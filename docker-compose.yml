services:
  acc-server:
    build: .
    image: ghcr.io/friems/acc-dedicated-server:latest
    container_name: acc-server
    restart: unless-stopped
    mac_address: ${ACC_MAC_ADDRESS:?set ACC_MAC_ADDRESS to a fixed MAC address for this container - see README's "Network" section}
    networks:
      acc-lan: {}
    environment:
      # dashboard login
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-changeme}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-please-change-this-secret}
      AUTO_START: ${AUTO_START:-true}

      # port the dashboard itself listens on. The container gets its own LAN
      # IP (see README's "Network" section) rather than being NAT/port-
      # published, so this IS the port you browse to - there's no separate
      # host-side mapping.
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}

      # seeds cfg/*.json ONLY the first time the volume is empty - after
      # that, edit everything from the dashboard instead.
      SERVER_NAME: ${SERVER_NAME:-My ACC Server}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme_admin}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      SPECTATOR_PASSWORD: ${SPECTATOR_PASSWORD:-}
      CAR_GROUP: ${CAR_GROUP:-FreeForAll}
      MAX_CAR_SLOTS: ${MAX_CAR_SLOTS:-26}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-30}
      TCP_PORT: ${TCP_PORT:-9232}
      UDP_PORT: ${UDP_PORT:-9231}
      REGISTER_TO_LOBBY: ${REGISTER_TO_LOBBY:-true}
      TRACK: ${TRACK:-monza}
      AMBIENT_TEMP: ${AMBIENT_TEMP:-22}
      CLOUD_LEVEL: ${CLOUD_LEVEL:-0.3}
      RAIN: ${RAIN:-0.0}
      WEATHER_RANDOMNESS: ${WEATHER_RANDOMNESS:-1}
    volumes:
      - ${DATA_PATH:?set DATA_PATH to a real host path before starting this stack - see README}:/data
      # pre-downloaded ACC dedicated server files (accServer.exe etc, e.g.
      # from a separate NAS share), mounted straight into the install dir -
      # see README's "Providing the server files" section.
      - ${ACC_SERVER_PATH:?set ACC_SERVER_PATH to the folder containing your pre-downloaded ACC dedicated server files - see README}:/data/accserver

networks:
  # the container is attached directly to this pre-existing bridged network
  # (e.g. a QNAP Container Station virtual switch) so it gets its own real
  # LAN IP via DHCP, instead of going through docker's default NAT +
  # port-publishing - see README's "Network" section for why.
  acc-lan:
    external: true
    name: ${ACC_NETWORK_NAME:?set ACC_NETWORK_NAME to your pre-existing bridged/macvlan-style docker network name - see README}
